name: Standalone apps
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
            arch: arm64
          - os: ubuntu-22.04
            target: linux-x64
            arch: x64
          - os: ubuntu-22.04-arm
            target: linux-arm64
            arch: arm64
          - os: windows-2022
            target: windows-x64
            arch: x64
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-gcc
            prefix: mingw64
          - os: windows-11-arm
            target: windows-arm64
            arch: arm64
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-clang
            prefix: clangarm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          architecture: ${{ matrix.arch }}
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv build-essential
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.toolchain }}
          update: ${{ matrix.arch == 'arm64' }}
          path-type: inherit
      - name: Windows compiler path
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH '${{ steps.msys2.outputs.msys2-location }}\${{ matrix.prefix }}\bin'
      - name: Windows test desktop
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # First-listen notifications steal the pointer from the native input fixture.
          Set-NetFirewallProfile -Profile Domain,Private,Public -NotifyOnListen False
          Get-NetFirewallProfile | Select-Object Name,Enabled,NotifyOnListen
      - name: Source checks
        shell: bash
        run: |
          node --check drive.mjs
          node --check runtime.mjs
          node drive.mjs --selftest
          node --test wifi/test/*.test.mjs
          node --test packaging/test/*.test.mjs
      - name: Package application
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node packaging/build.mjs
      - name: Prepare Windows ARM64 interactive desktop
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: powershell
        run: |
          # https://github.com/actions/runner-images/issues/14069
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
          New-Item -Path $policy -Force | Out-Null
          Set-ItemProperty -Path $policy -Name DisablePrivacyExperience -Type DWord -Value 1
          $engagement = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement'
          New-Item -Path $engagement -Force | Out-Null
          Set-ItemProperty -Path $engagement -Name ScoobeSystemSettingEnabled -Type DWord -Value 0
          Get-Process -Name UserOOBEBroker,WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Add-Type -Namespace WLtoysCI -Name Desktop -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr window, int command);
          '@
          Get-Process | Where-Object MainWindowHandle -ne 0 | ForEach-Object {
            Write-Host "Minimizing $($_.ProcessName): $($_.MainWindowTitle)"
            [void][WLtoysCI.Desktop]::ShowWindowAsync($_.MainWindowHandle, 6)
          }
          (New-Object -ComObject WScript.Shell).SendKeys('{ESC}')
      - name: Verify extracted application
        timeout-minutes: 3
        shell: bash
        run: |
          for archive in dist/*.zip dist/*.tar.gz; do
            [ -f "$archive" ] || continue
            node packaging/verify.mjs "$archive"
          done
      - name: Capture Windows test failure
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .ci-evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$pwd\.ci-evidence\desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()
          Get-Process | Where-Object MainWindowHandle -ne 0 | Select-Object Id,ProcessName,MainWindowTitle | Out-File .ci-evidence\windows.txt
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: debug-${{ matrix.target }}
          path: .ci-evidence/*
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum ./wltoys-drive-*.zip ./wltoys-drive-*.tar.gz ./*-helper-macos-arm64 > SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" ./wltoys-drive-*.zip ./wltoys-drive-*.tar.gz ./wltoys-drive-*.sha256 ./*-helper-macos-arm64 ./SHA256SUMS --clobber
